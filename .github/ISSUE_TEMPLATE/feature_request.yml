name: Feature request
description: Suggest a new feature or an improvement.
title: "feat: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Larger changes, especially ones that involve a real design decision, are recorded as an ADR under [`adrs/`](../tree/main/adrs) before they're built. Agreeing on the problem here first saves everyone time.

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of YARP Proxy Manager would this change? Pick all that apply.
      multiple: true
      options:
        - Proxy (routing, TLS, OIDC sign-in)
        - Management API
        - Files service
        - UI
        - Deployment (Quadlet units, scripts, images)
        - Documentation
        - Not sure
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
      placeholder: I want to ... but currently ...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How you'd like it to work. UI sketches or example config are welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you've tried.

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I'd be willing to open a pull request for this.
