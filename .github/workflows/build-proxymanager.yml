name: Build Proxy Manager
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, edited]
    paths-ignore:
      - '**.md'

env:
  RID: linux-x64
  BUILD_CONFIGURATION: Release
  SOLUTION_PATH: ProxyManager.sln

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore "$SOLUTION_PATH"

      - name: Build
        run: dotnet build "$SOLUTION_PATH" --configuration "$BUILD_CONFIGURATION" --no-restore

      - name: Test
        run: dotnet test "$SOLUTION_PATH" --configuration "$BUILD_CONFIGURATION" --no-build --verbosity normal --results-directory coverage -- --filter-trait "Category=Unit" --coverlet --coverlet-output-format cobertura --coverlet-exclude-by-file "**/Migrations/**/*.cs" --coverlet-exclude-by-attribute "GeneratedCodeAttribute" --coverlet-exclude-assemblies-without-sources MissingAll

      - name: ReportGenerator
        uses: danielpalme/ReportGenerator-GitHub-Action@5f3701a41d14548c9b8e575a5c235230e515cbc0 # 5.6.0
        with:
          reports: coverage/**/*cobertura*.xml
          targetdir: coveragereport
          reporttypes: Html;MarkdownSummaryGithub

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CoverageReport
          path: coveragereport

      - name: Publish coverage in build summary
        run: cat coveragereport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
        shell: bash

  report:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Download coverage report artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.0
        with:
          name: CoverageReport
          path: coveragereport

      - name: Add comment to PR
        run: gh pr comment "$PR_NUMBER" --edit-last --create-if-none --body-file coveragereport/SummaryGithub.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.number }}
